<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Выбор адреса</title>
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=939efcd0-c543-4a39-bbda-04cb43eff8df&suggest_apikey=bca2f613-9c3f-4eff-afaa-416e5dd85bc2&load=package.full,SuggestView" type="text/javascript"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f7fc; padding: 12px; }
.card { background: #fff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 480px; width: 100%; margin: 0 auto; padding: 16px 14px 20px; }
#id-indicator { padding: 10px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
#id-indicator.wait { background: #fff8e1; color: #8a6d00; border: 2px dashed #f0a500; }
#id-indicator.ok { background: #e8f5e9; color: #2e7d32; border: 2px solid #43a047; }
#id-indicator.fail { background: #ffebee; color: #c62828; border: 2px solid #e53935; }
#diag { background: #1e2c3a; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
#diag .ok { color: #7ee787; }
#diag .err { color: #ff7b72; }
#diag .info { color: #79c0ff; }
#diag .warn { color: #ffa657; }
#address-input { width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 14px; outline: none; box-sizing: border-box; }
#address-input:focus { border-color: #2a5298; }
#map { width: 100%; height: 200px; border-radius: 14px; overflow: hidden; margin: 10px 0; background: #eef2f6; }
.info-row { display: flex; align-items: baseline; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #eef2f6; }
.info-label { font-weight: 500; min-width: 70px; }
.info-value { font-weight: 600; word-break: break-word; flex: 1; font-size: 12px; }
.info-value.empty { color: #8a9aa8; font-weight: 400; font-style: italic; }
.btn-primary { background: #1e3c72; color: #fff; border: none; border-radius: 60px; padding: 13px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(30,60,114,0.25); margin-top: 10px; }
.btn-primary:disabled { background: #c0cbd9; box-shadow: none; cursor: not-allowed; }
.status { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
.status.ok { color: #2e7d32; font-weight: 600; }
.status.err { color: #c62828; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
<div id="id-indicator" class="wait">⏳ Ждём ID пользователя от мини-приложения...</div>
<div id="diag">=== СТАРТ ДИАГНОСТИКИ ===</div>
<input type="text" id="address-input" placeholder="Введите адрес..." autocomplete="off">
<div id="map"></div>
<div class="info-row"><span class="info-label">Адрес:</span><span class="info-value empty" id="address-value">не выбран</span></div>
<div class="info-row"><span class="info-label">Ссылка:</span><span class="info-value empty" id="link-value">не выбрана</span></div>
<button class="btn-primary" id="send-btn" disabled>Сохранить</button>
<div class="status" id="status"></div>
</div>

<script>
var PUZZLEBOT_TOKEN = 'oiteBLvPGR8E83oOxAZrecVWgt4Rop3U';
var PUZZLEBOT_API = 'https://api.puzzlebot.top/';

var diag = document.getElementById('diag');
function diagLog(text, cls) {
    var time = new Date().toLocaleTimeString('ru-RU');
    diag.innerHTML += '[' + time + '] ' + (cls ? '<span class="' + cls + '">' + text + '</span>' : text) + '\n';
    diag.scrollTop = diag.scrollHeight;
}

diagLog('0. Страница загружена', 'info');
diagLog('0.1. URL страницы: ' + window.location.href);

// Проверяем, есть ли suggest_apikey в подключенном скрипте
var scripts = document.getElementsByTagName('script');
for (var i = 0; i < scripts.length; i++) {
    if (scripts[i].src && scripts[i].src.indexOf('api-maps.yandex.ru') !== -1) {
        diagLog('0.2. URL скрипта Яндекс.Карт:');
        diagLog('     ' + scripts[i].src);
        if (scripts[i].src.indexOf('suggest_apikey') !== -1) {
            diagLog('0.3. suggest_apikey присутствует в URL ✅', 'ok');
        } else {
            diagLog('0.3. suggest_apikey ОТСУТСТВУЕТ ❌', 'err');
        }
    }
}

// Ловим все ошибки на странице
window.addEventListener('error', function(e) {
    diagLog('❌ JS-ошибка: ' + (e.message || 'неизвестно') + ' | ' + (e.filename || ''), 'err');
});

// Ловим ошибки загрузки ресурсов (скрипты, картинки и т.д.)
window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
        diagLog('❌ Не загрузился скрипт: ' + e.target.src, 'err');
    }
}, true);

// Перехватываем fetch и XHR, чтобы видеть сетевые запросы
var originalFetch = window.fetch;
window.fetch = function() {
    var url = arguments[0];
    diagLog('🌐 fetch → ' + url, 'info');
    return originalFetch.apply(this, arguments).then(function(resp) {
        diagLog('🌐 fetch ← ' + resp.status + ' ' + url, resp.ok ? 'ok' : 'err');
        return resp;
    }).catch(function(err) {
        diagLog('❌ fetch ошибка: ' + err.message, 'err');
        throw err;
    });
};

var originalXHROpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url) {
    diagLog('🌐 XHR ' + method + ' → ' + url, 'info');
    this.addEventListener('load', function() {
        diagLog('🌐 XHR ← ' + this.status + ' ' + url, this.status === 200 ? 'ok' : 'err');
    });
    this.addEventListener('error', function() {
        diagLog('❌ XHR ошибка: ' + url, 'err');
    });
    return originalXHROpen.apply(this, arguments);
};

// Проверяем загрузку ymaps
setTimeout(function() {
    if (typeof ymaps === 'undefined') {
        diagLog('❌ ymaps не загрузился', 'err');
    } else {
        diagLog('1. ymaps загрузился ✅', 'ok');
    }
}, 2000);

// === Получение ID пользователя ===
var tgUserId = '';
var selectedAddress = '';
var selectedLink = '';
var myMap = null;
var myPlacemark = null;

var idIndicator = document.getElementById('id-indicator');

window.addEventListener('message', function(event) {
    diagLog('📩 Получено сообщение от родителя: ' + JSON.stringify(event.data));
    if (event.data && event.data.type === 'TG_USER_ID') {
        tgUserId = event.data.userId;
        idIndicator.className = 'ok';
        idIndicator.innerHTML = '✅ ID получен: <b>' + tgUserId + '</b>';
        diagLog('👤 user_id установлен: ' + tgUserId, 'ok');
    }
});

setTimeout(function () {
    if (!tgUserId) {
        idIndicator.className = 'fail';
        idIndicator.innerHTML = '❌ ID не получен за 5 секунд';
        diagLog('⚠️ ID пользователя не получен за 5 сек', 'warn');
    }
}, 5000);

// === Сохранение переменной ===
function saveVariable(variableName, value) {
    var formData = new FormData();
    formData.append('token', PUZZLEBOT_TOKEN);
    formData.append('method', 'variableChange');
    formData.append('variable', variableName);
    formData.append('expression', value);
    formData.append('user_id', tgUserId);
    navigator.sendBeacon(PUZZLEBOT_API, formData);
    diagLog('💾 sendBeacon: ' + variableName + ' = ' + value, 'ok');
}

// === Основная логика карты ===
ymaps.ready(function () {
    diagLog('2. ymaps.ready вызван ✅', 'ok');

    var addressValue = document.getElementById('address-value');
    var linkValue = document.getElementById('link-value');
    var sendBtn = document.getElementById('send-btn');
    var statusEl = document.getElementById('status');

    // Проверяем наличие всех нужных модулей
    diagLog('3. Проверка модулей:');
    diagLog('   ymaps.Map: ' + (typeof ymaps.Map !== 'undefined' ? '✅' : '❌'), typeof ymaps.Map !== 'undefined' ? 'ok' : 'err');
    diagLog('   ymaps.Placemark: ' + (typeof ymaps.Placemark !== 'undefined' ? '✅' : '❌'), typeof ymaps.Placemark !== 'undefined' ? 'ok' : 'err');
    diagLog('   ymaps.SuggestView: ' + (typeof ymaps.SuggestView !== 'undefined' ? '✅' : '❌'), typeof ymaps.SuggestView !== 'undefined' ? 'ok' : 'err');
    diagLog('   ymaps.geocode: ' + (typeof ymaps.geocode !== 'undefined' ? '✅' : '❌'), typeof ymaps.geocode !== 'undefined' ? 'ok' : 'err');

    // === Создаём карту ===
    try {
        myMap = new ymaps.Map('map', {
            center: [45.035470, 38.975313],
            zoom: 12,
            controls: ['zoomControl']
        });
        diagLog('4. Карта создана ✅', 'ok');
    } catch (e) {
        diagLog('❌ Ошибка создания карты: ' + e.message, 'err');
        return;
    }

    try {
        myPlacemark = new ymaps.Placemark(myMap.getCenter(), {}, { preset: 'islands#blueIcon' });
        myMap.geoObjects.add(myPlacemark);
        diagLog('5. Метка добавлена ✅', 'ok');
    } catch (e) {
        diagLog('❌ Ошибка добавления метки: ' + e.message, 'err');
    }

    // === Создаём SuggestView с подробным логированием ===
    if (typeof ymaps.SuggestView === 'undefined') {
        diagLog('❌ SuggestView недоступен — модуль не загрузился', 'err');
        diagLog('   Попробуйте проверить подключение скрипта API', 'warn');
        return;
    }

    diagLog('6. Создаём SuggestView...');

    var suggestView = null;
    try {
        suggestView = new ymaps.SuggestView('address-input', {
            results: 10
        });
        diagLog('7. SuggestView создан ✅', 'ok');
        diagLog('   Объект: ' + (suggestView ? 'существует' : 'null'));
    } catch (e) {
        diagLog('❌ Ошибка создания SuggestView: ' + e.message, 'err');
        return;
    }

    // === Проверяем, есть ли события у SuggestView ===
    try {
        var inputEl = document.getElementById('address-input');
        diagLog('8. Input-элемент найден: ' + (inputEl ? 'да' : 'нет'), inputEl ? 'ok' : 'err');

        // Слушаем событие выбора адреса
        suggestView.events.add('select', function (e) {
            diagLog('✅ Событие SELECT сработало', 'ok');
            var item = e.get('item');
            var value = item.value;
            var displayName = item.displayName || value;

            diagLog('   Выбран адрес: ' + displayName);

            selectedAddress = displayName || value;
            selectedLink = 'https://yandex.ru/maps/?text=' + encodeURIComponent(value);

            addressValue.textContent = selectedAddress;
            addressValue.classList.remove('empty');
            linkValue.textContent = selectedLink;
            linkValue.classList.remove('empty');
            sendBtn.disabled = false;
            statusEl.textContent = '';

            ymaps.geocode(value, { results: 1 }).then(function (res) {
                var firstGeoObject = res.geoObjects.get(0);
                if (firstGeoObject) {
                    var coords = firstGeoObject.geometry.getCoordinates();
                    myMap.setCenter(coords, 16);
                    myPlacemark.geometry.setCoordinates(coords);
                    diagLog('   Карта центрирована: ' + coords, 'ok');
                }
            });
        });
        diagLog('9. Обработчик select добавлен ✅', 'ok');
    } catch (e) {
        diagLog('❌ Ошибка добавления обработчика: ' + e.message, 'err');
    }

    // === Логируем ввод в поле ===
    var inputEl = document.getElementById('address-input');
    var lastLogged = '';
    inputEl.addEventListener('input', function() {
        var v = inputEl.value;
        if (v.length >= 2 && v !== lastLogged) {
            lastLogged = v;
            diagLog('⌨️ Введено: "' + v + '" (длина ' + v.length + ')', 'info');
        }
    });

    inputEl.addEventListener('focus', function() {
        diagLog('👁️ Поле в фокусе', 'info');
    });

    // === Проверяем через 2 секунды, появилась ли панель подсказок в DOM ===
    setTimeout(function() {
        var suggestContainers = document.querySelectorAll('.ymaps-suggest, [class*="suggest"]');
        diagLog('10. Проверка DOM через 2 сек: найдено ' + suggestContainers.length + ' элементов с "suggest"', 'info');
    }, 2000);

    // === Обработчик кнопки Сохранить ===
    sendBtn.addEventListener('click', function () {
        diagLog('🖱️ Кнопка Сохранить нажата', 'info');
        statusEl.className = 'status';
        statusEl.textContent = '';

        if (!selectedAddress || !selectedLink) {
            diagLog('⚠️ Адрес не выбран', 'warn');
            return;
        }

        if (!tgUserId) {
            statusEl.className = 'status err';
            statusEl.textContent = 'ID не получен';
            diagLog('❌ Нет user_id', 'err');
            return;
        }

        saveVariable('ADD_APP_ADDRESS', selectedAddress);
        saveVariable('ADD_APP_LINK', selectedLink);

        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Адрес сохранён!';
    });

    diagLog('=== ИНИЦИАЛИЗАЦИЯ ЗАВЕРШЕНА ===', 'ok');
    diagLog('👉 Теперь начните вводить адрес', 'warn');
});
</script>
</body>
</html>
