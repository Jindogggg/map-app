#address-input:disabled { background: #f0f4fa; color: #8a9aa8; cursor: not-allowed; }

function abbreviate(text) {
    if (!text) return text;
    var result = text;
    for (var i = 0; i < ABBREVIATIONS.length; i++) {
        result = result.replace(ABBREVIATIONS[i].from, ABBREVIATIONS[i].to);
    }
    return result;
}

function abbreviateStreet(text) {
    if (!text) return text;
    var result = String(text).trim();
    for (var i = 0; i < STREET_SUFFIXES.length; i++) {
        if (STREET_SUFFIXES[i].pattern.test(result)) {
            var stripped = result.replace(STREET_SUFFIXES[i].pattern, '').trim();
            result = STREET_SUFFIXES[i].abbr + stripped;
            break;
        }
    }
    return abbreviate(result);
}

function stripPrefixes(text) {
    if (!text) return text;
    var result = String(text).trim();
    var iterations = 0;
    var changed = true;
    while (changed && iterations < 15) {
        changed = false;
        for (var i = 0; i < PREFIXES_TO_STRIP.length; i++) {
            var newResult = result.replace(PREFIXES_TO_STRIP[i], '');
            if (newResult !== result) {
                result = newResult.trim();
                changed = true;
                break;
            }
        }
        iterations++;
    }
    return result.trim();
}

function waitForYmaps(cb) {
    if (typeof ymaps !== 'undefined' && ymaps.ready) {
        ymaps.ready(cb);
        return;
    }
    var attempts = 0;
    var iv = setInterval(function() {
        attempts++;
        if (typeof ymaps !== 'undefined' && ymaps.ready) {
            clearInterval(iv);
            diagLog('✅ Yandex API загрузился (попыток: ' + attempts + ')', 'ok');
            ymaps.ready(cb);
        } else if (attempts > 600) {
            clearInterval(iv);
            diagLog('❌ Yandex API не загрузился за 60 сек', 'err');
            showWarning('❌ Не удалось загрузить карту. Обновите страницу.', 'error');
        }
    }, 100);
}

function createSuggestView() {
    if (suggestViewCreated) return;
    if (typeof ymaps.SuggestView === 'undefined') {
        diagLog('❌ SuggestView не доступен', 'err');
        return;
    }
    try {
        var suggestView = new ymaps.SuggestView('address-input', { results: 10 });
        suggestViewCreated = true;
        diagLog('✅ SuggestView создан', 'ok');

        suggestView.events.add('select', function (e) {
            var item = e.get('item');
            var value = item.value;
            var displayName = item.displayName || value;

            selectedAddress = displayName || value;
            selectedLink = 'https://yandex.ru/maps/?text=' + encodeURIComponent(value);

            if (isAdmin) diagLog('👤 Выбран адрес: ' + selectedAddress, 'info');

            showWarning('⏳ Проверяем адрес...', 'warn');
            if (jsonOutput) jsonOutput.value = 'Загрузка...';
            if (copyBtn) copyBtn.disabled = true;

            ymaps.geocode(value, { results: 1 }).then(function (res) {
                var g = res.geoObjects.get(0);
                if (!g) { showWarning('❌ Адрес не распознан', 'error'); return; }
                var coords = g.geometry.getCoordinates();
                selectedCoords = coords;
                if (myMap && isAdmin) {
                    myMap.setCenter(coords, 16);
                    myPlacemark.geometry.setCoordinates(coords);
                }

                fetchGeocoder(coords, { coords: coords, link: selectedLink }, function(result, err) {
                    if (result) {
                        if (jsonOutput) jsonOutput.value = JSON.stringify(result, null, 2);
                        if (copyBtn) copyBtn.disabled = false;
                    }
                });
            }).catch(function(e) {
                showWarning('❌ Ошибка: ' + e.message, 'error');
            });
        });
    } catch(e) {
        diagLog('❌ Ошибка создания SuggestView: ' + e.message, 'err');
    }
}

function isSelectedCity(text, city) {
    if (!city || !text) return false;
    var t = text.toLowerCase(), c = city.toLowerCase();
    if (t === c) return true;
    var words = t.split(/[\s,.\-()\/]+/);
    for (var i = 0; i < words.length; i++) if (words[i] === c) return true;
    return false;
}

function detectType(text, list) {
    var l = text.toLowerCase().trim();
    for (var i = 0; i < list.length; i++) {
        for (var j = 0; j < list[i].prefixes.length; j++) {
            if (l.indexOf(list[i].prefixes[j].toLowerCase()) === 0) return list[i].field;
        }
    }
    return null;
}

function startsWithOtherPrefix(text) {
    var l = text.toLowerCase().trim();
    for (var i = 0; i < OTHER_PREFIXES.length; i++) {
        if (l.indexOf(OTHER_PREFIXES[i]) === 0) return true;
    }
    return false;
}

function buildDistrict(values) {
    var important = [], unimportant = [], unknown = [];
    values.forEach(function(v) {
        var imp = detectType(v, IMPORTANT_TYPES);
        if (imp) {
            for (var k = 0; k < IMPORTANT_TYPES.length; k++) {
                if (IMPORTANT_TYPES[k].field === imp) { important.push({ name: v, priority: k }); break; }
            }
            return;
        }
        var uni = detectType(v, UNIMPORTANT_TYPES);
        if (uni) {
            for (var m = 0; m < UNIMPORTANT_TYPES.length; m++) {
                if (UNIMPORTANT_TYPES[m].field === uni) { unimportant.push({ name: v, priority: m }); break; }
            }
            return;
        }
        unknown.push(v);
    });
    important.sort(function(a,b){ return a.priority - b.priority; });
    unimportant.sort(function(a,b){ return a.priority - b.priority; });
    var res = important.map(function(x){ return x.name; });
    if (unimportant.length > 0) res.push(unimportant[0].name);
    unknown.forEach(function(v) { res.push(v); });
    return res;
}

function tokenizeAddress(addr) {
    if (!addr) return [];
    var parts = addr.split(/[,;]/);
    var result = [];
    for (var i = 0; i < parts.length; i++) {
        var t = parts[i].trim().toLowerCase();
        if (t) result.push(t);
    }
    return result;
}

function pickMatchingHouse(houseArr, selectedAddress) {
    if (!houseArr || houseArr.length === 0) return '';
    if (houseArr.length === 1) return String(houseArr[0]).trim();
    var tokens = tokenizeAddress(selectedAddress);
    for (var i = 0; i < houseArr.length; i++) {
        var h = String(houseArr[i]).trim().toLowerCase();
        for (var j = 0; j < tokens.length; j++) {
            if (tokens[j] === h) {
                if (isAdmin) diagLog('   house выбран: ' + houseArr[i], 'ok');
                return String(houseArr[i]).trim();
            }
        }
    }
    return String(houseArr[0]).trim();
}

function pickMatchingStreet(streetArr, selectedAddress) {
    if (!streetArr || streetArr.length === 0) return '';
    if (streetArr.length === 1) return String(streetArr[0]).trim();
    var addr = (selectedAddress || '').toLowerCase();
    for (var i = 0; i < streetArr.length; i++) {
        var s = String(streetArr[i]).trim().toLowerCase();
        if (s && addr.indexOf(s) !== -1) {
            if (isAdmin) diagLog('   street выбран: ' + streetArr[i], 'ok');
            return String(streetArr[i]).trim();
        }
    }
    return String(streetArr[0]).trim();
}

function areasMatch(addressAreaArr) {
    if (!cityAreaArr || cityAreaArr.length === 0) return false;
    if (!addressAreaArr || addressAreaArr.length === 0) return false;
    var matches = 0;
    for (var i = 0; i < cityAreaArr.length; i++) {
        var c = cityAreaArr[i].toLowerCase();
        for (var j = 0; j < addressAreaArr.length; j++) {
            var a = addressAreaArr[j].toLowerCase();
            if (c === a) {
                matches++;
                if (isAdmin) diagLog('   ✅ Совпадение: «' + cityAreaArr[i] + '» == «' + addressAreaArr[j] + '»', 'ok');
            }
        }
    }
    if (isAdmin) diagLog('   Совпадений всего: ' + matches, matches > 0 ? 'ok' : 'warn');
    return matches > 0;
}

var ORIENT_KINDS = [
    { kind: 'district', prefix: 'в районе ' },
    { kind: 'metro', prefix: 'рядом с ' },
    { kind: 'railwayStation', prefix: 'недалеко от ' },
    { kind: 'station', prefix: 'рядом с ' },
    { kind: 'street', prefix: 'в районе ' }
];

function findOrient(coords, callback) {
    var lon = coords[1], lat = coords[0];
    function tryKind(idx) {
        if (idx >= ORIENT_KINDS.length) { callback(null, null); return; }
        var item = ORIENT_KINDS[idx];
        var url = 'https://geocode-maps.yandex.ru/1.x/?apikey=' + GEOCODER_KEY +
            '&format=json&results=1&lang=ru_RU&kind=' + item.kind + '&geocode=' + lon + ',' + lat;
        fetch(url).then(function(r){ return r.json(); }).then(function(data) {
            if (!data || !data.response || !data.response.GeoObjectCollection) { tryKind(idx + 1); return; }
            var m = data.response.GeoObjectCollection.featureMember;
            if (!m || m.length === 0) { tryKind(idx + 1); return; }
            var geo = m[0].GeoObject;
            var meta = geo.metaDataProperty.GeocoderMetaData;
            var comps = meta.Address && meta.Address.Components ? meta.Address.Components : [];
            if (item.kind === 'district') {
                var districts = [];
                comps.forEach(function(c) { if (c.kind === 'district') districts.push(c.name); });
                if (districts.length > 0) { callback(buildDistrict(districts), item.prefix); return; }
                tryKind(idx + 1);
                return;
            }
            var found = null;
            for (var i = 0; i < comps.length; i++) if (comps[i].kind === item.kind) { found = comps[i].name; break; }
            if (found) callback([found], item.prefix);
            else tryKind(idx + 1);
        }).catch(function() { tryKind(idx + 1); });
    }
    tryKind(0);
}

function handleGeocoderData(data, baseJson, onDone) {
    if (!data || !data.response || !data.response.GeoObjectCollection) { onDone(null, 'Нет данных'); return; }
    var members = data.response.GeoObjectCollection.featureMember;
    if (!members || members.length === 0) { onDone(null, 'Нет данных'); return; }

    var meta = members[0].GeoObject.metaDataProperty.GeocoderMetaData;
    var comps = meta.Address && meta.Address.Components ? meta.Address.Components : [];

    diagLog('=== Все компоненты адреса ===', 'new');
    comps.forEach(function(c) {
        diagLog('   kind: "' + c.kind + '" → "' + c.name + '"', 'info');
    });

    var byKind = {};
    comps.forEach(function(c) {
        if (!byKind[c.kind]) byKind[c.kind] = [];
        byKind[c.kind].push(c.name);
    });

    var localityArrRaw = byKind.locality || [];
    var areaArr = byKind.area || [];
    var districtArr = (byKind.district || []).slice();
    var streetArr = byKind.street || [];
    var houseArr = byKind.house || [];
    var otherArr = byKind.other || [];
    var metroArr = byKind.metroStation || [];
    var precision = meta.precision || '';
    var coords = baseJson.coords, link = baseJson.link;

    var localityIsCity = false;
    for (var i = 0; i < localityArrRaw.length; i++) {
        if (isSelectedCity(localityArrRaw[i], selectedCity)) { localityIsCity = true; break; }
    }
    diagLog('localityIsCity: ' + localityIsCity, 'new');

    var localityArr = [];
    var localityAsDistrict = [];

    localityArrRaw.forEach(function(v) {
        if (isSelectedCity(v, selectedCity)) {
            localityArr.push(v);
            diagLog('   locality (город): ' + v, 'ok');
            return;
        }
        if (detectType(v, IMPORTANT_TYPES)) {
            localityArr.push(v);
            diagLog('   locality (населённый пункт): ' + v, 'ok');
            return;
        }
        localityAsDistrict.push(v);
        diagLog('   locality→district: ' + v, 'warn');
    });

    if (localityAsDistrict.length > 0) {
        localityAsDistrict.forEach(function(v) { districtArr.push(v); });
    }

    otherArr.forEach(function(v) {
        if (startsWithOtherPrefix(v)) {
            districtArr.push(v);
            diagLog('   other→district: ' + v, 'ok');
        } else {
            diagLog('   other (пропуск): ' + v, 'warn');
        }
    });

    metroArr.forEach(function(v) {
        districtArr.push('метро ' + v);
        diagLog('   metroStation→district: метро ' + v, 'ok');
    });

    var seen = {};
    districtArr = districtArr.filter(function(v) {
        var key = v.toLowerCase();
        if (seen[key]) return false;
        seen[key] = true;
        return true;
    });

    var streetStr = pickMatchingStreet(streetArr, selectedAddress);
    var houseStr = pickMatchingHouse(houseArr, selectedAddress);

    if (isAdmin) diagLog('streetArr: ' + JSON.stringify(streetArr) + ' → ' + streetStr, 'info');
    if (isAdmin) diagLog('houseArr: ' + JSON.stringify(houseArr) + ' → ' + houseStr, 'info');
    if (isAdmin) diagLog('localityArr: ' + JSON.stringify(localityArr), 'info');
    if (isAdmin) diagLog('districtArr: ' + JSON.stringify(districtArr), 'info');
    if (isAdmin) diagLog('areaArr (адрес): ' + JSON.stringify(areaArr), 'info');

    if (localityIsCity) {
        if (districtArr.length > 0) {
            var district = buildDistrict(districtArr.slice());
            if (houseStr.length > 0 && (streetStr.length > 0 || district.length > 0)) {
                finishSuccess(district, coords, link, streetStr, houseStr, precision, true, onDone);
            } else {
                finishFail('Введите точный адрес (улица и номер дома).', onDone);
            }
        } else {
            if (houseStr.length > 0 && streetStr.length > 0) {
                findOrient(coords, function(orientArr, prefix) {
                    if (!orientArr || orientArr.length === 0) {
                        finishFail('Не удалось найти ориентир. Уточните адрес.', onDone);
                        return;
                    }
                    finishSuccess([prefix + orientArr.join(', ')], coords, link, streetStr, houseStr, precision, true, onDone);
                });
            } else {
                finishFail('Введите точный адрес (улица и номер дома).', onDone);
            }
        }
        return;
    }

    diagLog('=== [0.2] Сравнение area ===', 'new');
    var areaMatches = areasMatch(areaArr);

    if (!areaMatches) {
        if (houseStr.length === 0) { finishFail('Введите точный адрес (номер дома).', onDone); return; }
        var streetMissing = (streetStr.length === 0);
        var localityStr = localityArr.length > 0 ? localityArr[0] : '';
        var district = [];
        if (districtArr.length > 0) district = buildDistrict(districtArr.slice());
        finishSuccessOutside(district, coords, link, streetStr, houseStr, precision, localityStr, streetMissing, onDone);
        return;
    }

    var localityNonCity = [];
    localityArr.forEach(function(v) { if (!isSelectedCity(v, selectedCity)) localityNonCity.push(v); });
    var hasDistrict = districtArr.length > 0 || localityNonCity.length > 0;

    if (hasDistrict) {
        var values = [];
        localityNonCity.forEach(function(v) { values.push(v); });
        districtArr.forEach(function(v) { values.push(v); });
        var district = buildDistrict(values);
        if (houseStr.length > 0 && (streetStr.length > 0 || district.length > 0)) {
            finishSuccess(district, coords, link, streetStr, houseStr, precision, true, onDone);
        } else {
            finishFail('Введите точный адрес (улица и номер дома).', onDone);
        }
    } else {
        if (localityNonCity.length === 0) { finishFail('Не удалось определить ориентир.', onDone); return; }
        var district = [localityNonCity.join(', ')];
        if (houseStr.length > 0) {
            finishSuccess(district, coords, link, streetStr, houseStr, precision, true, onDone);
        } else {
            finishFail('Введите адрес до конца (номер дома).', onDone);
        }
    }
}

function finishSuccess(district, coords, link, street, house, precision, isExact, onDone) {
    var result = {
        coords: coords,
        in_city: true,
        district: district.join(', '),
        street: street,
        house: house,
        is_exact: isExact,
        precision: precision,
        link: link
    };
    pendingLocalityMode = NO_LOCALITY;
    result.link_search = buildSearchLink(result, NO_LOCALITY);
    showPendingPopup(result, selectedAddress, false);
    onDone(result, null);
}

function finishSuccessOutside(district, coords, link, street, house, precision, localityStr, streetMissing, onDone) {
    var result = {
        coords: coords,
        in_city: false,
        locality: localityStr,
        district: district.join(', '),
        street: street,
        house: house,
        is_exact: true,
        precision: precision,
        link: link
    };
    pendingLocalityMode = localityStr || NO_VALUE;
    result.link_search = buildSearchLink(result, localityStr);
    showPendingPopup(result, selectedAddress, streetMissing);
    onDone(result, null);
}

function buildSearchLink(result, localityValue) {
    var parts = [];
    var loc = localityValue || '';
    if (!loc || loc === NO_LOCALITY || loc === NO_VALUE) {
        loc = selectedCity;
    }
    var cleanLoc = stripPrefixes(loc);
    if (cleanLoc.length > 0) parts.push(cleanLoc);
    if (result.district && result.district.length > 0 && result.district !== NO_VALUE) {
        var cleanDist = stripPrefixes(result.district);
        if (cleanDist.length > 0) parts.push(cleanDist);
    }
    if (result.street && result.street.length > 0 && result.street !== NO_VALUE) {
        var cleanStreet = stripPrefixes(result.street);
        if (cleanStreet.length > 0) parts.push(cleanStreet);
    }
    if (result.house && result.house.length > 0 && result.house !== NO_VALUE) {
        parts.push(result.house);
    }
    var query = parts.join(', ');
    return 'https://yandex.ru/maps/?text=' + encodeURIComponent(query);
}

function showPendingPopup(result, addressText, streetMissing) {
    pendingResult = result;
    if (popupAddress) popupAddress.textContent = addressText;
    var extraText = '';
    if (result.in_city === false) {
        extraText += '<br><br>⚠️ Адрес вне города. Стоимость и дата заявки, возможно, потребуют изменения по согласованию с исполнителем.';
    }
    if (streetMissing) {
        extraText += '<br><br>⚠️ Улица не указана. Возможно, данные в Яндекс.Картах неполные.';
    }
    if (popupText) popupText.innerHTML = 'Если адрес верный — нажмите «Подтвердить».' + extraText;
    if (popupOverlay) {
        popupOverlay.classList.add('visible');
        popupOverlay.style.display = 'flex';
    }
    if (isAdmin) {
        diagLog('📍 Показан попап: ' + addressText, 'new');
    }
}

function finishFail(message, onDone) {
    showWarning('❌ ' + message, 'error');
    onDone(null, message);
}

function buildTransferLine(result) {
    var locality = pendingLocalityMode || NO_LOCALITY;
    if (locality !== NO_LOCALITY && locality !== NO_VALUE && locality.length > 0) {
        locality = abbreviate(locality);
    }
    var district = (result.district && result.district.length > 0) ? abbreviate(result.district) : NO_VALUE;
    var street = (result.street && result.street.length > 0) ? abbreviateStreet(result.street) : NO_VALUE;
    var house = (result.house && result.house.length > 0) ? result.house : NO_VALUE;
    var link = (result.link && result.link.length > 0) ? result.link : NO_VALUE;
    var linkSearch = (result.link_search && result.link_search.length > 0) ? result.link_search : NO_VALUE;
    return [locality, district, street, house, link, linkSearch].join(DIVIDER);
}

function describePuzzleBotCode(code) {
    var codes = {
        0: 'успех',
        1: 'неверный формат токена',
        2: 'неверный формат метода',
        3: 'токен не найден',
        4: 'неизвестный метод',
        40: 'не передан user_id или tg_chat_id',
        100: 'внутренняя ошибка PuzzleBot',
        102: 'ошибка вычисления expression',
        104: 'переменная не найдена',
        200: 'команда не найдена',
        201: 'пользователь не найден',
        202: 'чат не найден',
        429: 'слишком много запросов'
    };
    return codes[code] || 'неизвестный код';
}

// ===== ОТПРАВКА С ТАЙМАУТОМ И ПОВТОРАМИ =====
function fetchWithTimeout(url, timeoutMs) {
    return new Promise(function(resolve, reject) {
        var controller = null;
        var timer = null;
        try {
            controller = new AbortController();
        } catch (e) {
            // AbortController не поддерживается — фолбэк на обычный fetch
            fetch(url, { method: 'GET' }).then(resolve).catch(reject);
            return;
        }
        timer = setTimeout(function() {
            try { controller.abort(); } catch (e) {}
            reject(new Error('ТАЙМАУТ'));
        }, timeoutMs);
        fetch(url, { method: 'GET', signal: controller.signal })
            .then(function(r) {
                clearTimeout(timer);
                resolve(r);
            })
            .catch(function(err) {
                clearTimeout(timer);
                reject(err);
            });
    });
}

function looksLikeCloudflareError(text) {
    if (!text) return false;
    var markers = ['cloudflare', 'Error code 525', 'Error code 52', 'SSL handshake', 'Attention Required'];
    var lower = String(text).toLowerCase();
    for (var i = 0; i < markers.length; i++) {
        if (lower.indexOf(markers[i].toLowerCase()) !== -1) return true;
    }
    return false;
}

function sendWithRetry(url) {
    var attempt = 0;
    function tryOnce() {
        attempt++;
        if (isAdmin) diagLog('🌐 Попытка ' + attempt + ' из ' + SEND_MAX_ATTEMPTS + '...', 'info');
        return fetchWithTimeout(url, SEND_TIMEOUT_MS)
            .then(function(r) { return r.text(); })
            .then(function(text) {
                if (looksLikeCloudflareError(text)) {
                    if (isAdmin) diagLog('⚠️ CorsProxy вернул страницу Cloudflare (их сервер упал).', 'warn');
                    throw new Error('CLOUDFLARE');
                }
                return text;
            })
            .catch(function(err) {
                if (attempt >= SEND_MAX_ATTEMPTS) {
                    throw err;
                }
                if (isAdmin) diagLog('   Попытка ' + attempt + ' не удалась: ' + err.message, 'warn');
                return new Promise(function(resolve) {
                    setTimeout(resolve, SEND_RETRY_DELAY_MS);
                }).then(tryOnce);
            });
    }
    return tryOnce();
}

document.getElementById('popup-ok').addEventListener('click', function() {
    popupOverlay.classList.remove('visible');
    popupOverlay.style.display = 'none';
    if (!pendingResult) return;

    var result = pendingResult;
    pendingResult = null;

    var line = buildTransferLine(result);
    if (isAdmin) diagLog('📤 Строка (6 полей): ' + line, 'new');

    var targetUrl = PUZZLEBOT_API +
        '?token=' + encodeURIComponent(PUZZLEBOT_TOKEN) +
        '&method=variableChange' +
        '&variable=ADD_APP_TEST' +
        '&expression=' + encodeURIComponent('"' + line + '"') +
        '&user_id=' + encodeURIComponent(tgUserId);

    var proxyUrl = 'https://corsproxy.io/?key=' + CORSPROXY_KEY + '&url=' + encodeURIComponent(targetUrl);

    showWarning('⏳ Сохраняем адрес...', 'warn');

    sendWithRetry(proxyUrl)
        .then(function(text) {
            if (isAdmin) diagLog('📥 Ответ (сырой): ' + text, 'info');

            var parsed;
            try {
                parsed = JSON.parse(text);
            } catch (e) {
                if (isAdmin) diagLog('❌ Ответ не JSON. CorsProxy вернул что-то не то.', 'err');
                showWarning('❌ Ошибка сохранения адреса. Попробуйте выбрать адрес ещё раз.', 'error');
                return;
            }

            if (parsed.error) {
                if (isAdmin) diagLog('❌ Ошибка CorsProxy: ' + parsed.error, 'err');
                showWarning('❌ Ошибка сохранения адреса. Попробуйте выбрать адрес ещё раз.', 'error');
                return;
            }

            if (parsed.code === undefined) {
                if (isAdmin) diagLog('❌ В ответе нет поля code. Что-то не так.', 'err');
                showWarning('❌ Ошибка сохранения адреса. Попробуйте выбрать адрес ещё раз.', 'error');
                return;
            }

            if (parsed.code !== 0) {
                if (isAdmin) diagLog('❌ Ошибка PuzzleBot. Код: ' + parsed.code + ' (' + describePuzzleBotCode(parsed.code) + ')', 'err');
                if (parsed.description) {
                    if (isAdmin) diagLog('   Описание: ' + parsed.description, 'err');
                }
                showWarning('❌ Ошибка сохранения адреса. Попробуйте выбрать адрес ещё раз.', 'error');
                return;
            }

            if (isAdmin) diagLog('✅ PuzzleBot ответил: код 0 (успех)', 'ok');
            if (jsonOutput) jsonOutput.value = JSON.stringify(result, null, 2);
            if (copyBtn) copyBtn.disabled = false;
            showWarning('✅ Адрес успешно найден и сохранён. Нажмите «Далее» для продолжения.', 'ok');
            addressInput.value = '';
            addressInput.disabled = true;
        })
        .catch(function(err) {
            if (isAdmin) diagLog('❌ Все ' + SEND_MAX_ATTEMPTS + ' попыток провалились. Последняя ошибка: ' + err.message, 'err');
            if (isAdmin) diagLog('   Что это значит: CorsProxy не ответил за ' + (SEND_TIMEOUT_MS * SEND_MAX_ATTEMPTS / 1000) + ' секунд.', 'err');
            showWarning('❌ Ошибка сохранения адреса. Попробуйте выбрать адрес ещё раз.', 'error');
        });
});

document.getElementById('popup-cancel').addEventListener('click', function() {
    popupOverlay.classList.remove('visible');
    popupOverlay.style.display = 'none';
    pendingResult = null;
    if (isAdmin) diagLog('❌ Отменено', 'warn');
    selectedAddress = ''; selectedLink = ''; selectedCoords = null;
    addressInput.value = '';
    addressInput.disabled = false;
    showWarning('', '');
    if (jsonOutput) jsonOutput.value = '';
    if (copyBtn) copyBtn.disabled = true;
});

function initMap() {
    if (myMap || !isAdmin) return;
    if (typeof ymaps === 'undefined' || !ymaps.Map) return;
    try {
        myMap = new ymaps.Map('map', {
            center: [45.035470, 38.975313], zoom: 12, controls: ['zoomControl']
        });
        myPlacemark = new ymaps.Placemark(myMap.getCenter(), {}, { preset: 'islands#blueIcon' });
        myMap.geoObjects.add(myPlacemark);
    } catch(e) {
        diagLog('❌ Ошибка создания карты: ' + e.message, 'err');
    }
}

function fetchGeocoder(coords, baseJson, onDone) {
    var lon = coords[1], lat = coords[0];
    var url = 'https://geocode-maps.yandex.ru/1.x/?apikey=' + GEOCODER_KEY +
        '&format=json&results=1&lang=ru_RU&geocode=' + lon + ',' + lat;
    if (isAdmin) diagLog('🔄 Геокодер...', 'new');
    fetch(url).then(function(r){ return r.json(); }).then(function(data) {
        handleGeocoderData(data, baseJson, onDone);
    }).catch(function(e) {
        if (isAdmin) diagLog('❌ Ошибка: ' + e.message, 'err');
        onDone(null, e.message);
    });
}

if (copyBtn) {
    copyBtn.addEventListener('click', function() {
        if (!jsonOutput.value || copyBtn.disabled) return;
        jsonOutput.select();
        jsonOutput.setSelectionRange(0, 999999);
        try {
            document.execCommand('copy');
            copyBtn.textContent = '✅ Скопировано!';
            setTimeout(function() { copyBtn.textContent = '📋 Скопировать JSON'; }, 2000);
        } catch (e) {}
    });
}
