<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест обратного геокодинга</title>
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=939efcd0-c543-4a39-bbda-04cb43eff8df" type="text/javascript"></script>
<style>
body { font-family: monospace; padding: 12px; background: #f4f7fc; }
.card { background: #fff; border-radius: 12px; padding: 16px; max-width: 700px; margin: 0 auto; }
h2 { font-size: 16px; margin: 12px 0 8px; }
pre { background: #1e2c3a; color: #e2e8f0; padding: 12px; border-radius: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.ok { color: #7ee787; }
.warn { color: #ffa657; }
.err { color: #ff7b72; }
.info { color: #79c0ff; }
#map { width: 100%; height: 200px; margin: 10px 0; border-radius: 8px; }
</style>
</head>
<body>
<div class="card">
    <h2>Тест: Мирошниченко, 43 (45.067175, 39.063878)</h2>
    <div id="map"></div>
    <h2>1. Прямой геокодинг (по адресу)</h2>
    <pre id="direct">Загрузка...</pre>
    <h2>2. Обратный с kind=district</h2>
    <pre id="revDistrict">Загрузка...</pre>
    <h2>3. Обратный БЕЗ kind (всё что есть)</h2>
    <pre id="revAll">Загрузка...</pre>
    <h2>4. Обратный с kind=metro</h2>
    <pre id="revMetro">Загрузка...</pre>
    <h2>5. Обратный с kind=street</h2>
    <pre id="revStreet">Загрузка...</pre>
</div>

<script>
var KEY = 'c46e5925-729b-4dfe-be6a-5277d5ab39dc';
var LAT = 45.067175, LON = 39.063878;

function log(id, text, cls) {
    var el = document.getElementById(id);
    var span = cls ? '<span class="' + cls + '">' + text + '</span>' : text;
    el.innerHTML += span + '\n';
}

// 1. Прямой геокодинг
ymaps.ready(function() {
    var map = new ymaps.Map('map', {
        center: [LAT, LON], zoom: 15, controls: ['zoomControl']
    });
    new ymaps.Placemark([LAT, LON]).setMap;
    var pm = new ymaps.Placemark([LAT, LON], {}, { preset: 'islands#redIcon' });
    map.geoObjects.add(pm);

    document.getElementById('direct').innerHTML = '';
    ymaps.geocode('Краснодар, улица Мирошниченко, 43', { results: 1 }).then(function(res) {
        var g = res.geoObjects.get(0);
        if (!g) { log('direct', 'пусто', 'err'); return; }
        var meta = g.metaDataProperty.GeocoderMetaData;
        log('direct', 'Адрес: ' + meta.text, 'ok');
        log('direct', 'precision: ' + meta.precision, 'info');
        log('direct', 'kind: ' + meta.kind, 'info');
        var comps = meta.Address.Components;
        comps.forEach(function(c) {
            log('direct', '  ' + c.kind + ': ' + c.name, 'info');
        });
    });

    // 2-5. Обратные запросы через прямые HTTP-запросы
    fetchReverse('revDistrict', 'district');
    fetchReverse('revAll', '');
    fetchReverse('revMetro', 'metro');
    fetchReverse('revStreet', 'street');
});

function fetchReverse(id, kind) {
    var url = 'https://geocode-maps.yandex.ru/1.x/?apikey=' + KEY +
        '&format=json&results=1&lang=ru_RU' +
        (kind ? '&kind=' + kind : '') +
        '&geocode=' + LON + ',' + LAT;

    document.getElementById(id).innerHTML = '';
    log(id, 'kind: ' + (kind || '(без kind)'), 'info');
    log(id, 'URL: ' + url, 'info');

    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        var m = data.response.GeoObjectCollection.featureMember;
        if (!m || m.length === 0) {
            log(id, '❌ ПУСТО — ничего не найдено', 'err');
            return;
        }
        log(id, '✅ Найдено объектов: ' + m.length, 'ok');
        for (var i = 0; i < m.length; i++) {
            var g = m[i].GeoObject;
            var meta = g.metaDataProperty.GeocoderMetaData;
            log(id, '--- Объект ' + (i+1) + ' ---', 'warn');
            log(id, 'text: ' + meta.text, 'ok');
            log(id, 'kind: ' + meta.kind, 'info');
            log(id, 'precision: ' + meta.precision, 'info');
            if (meta.Address && meta.Address.Components) {
                meta.Address.Components.forEach(function(c) {
                    log(id, '  ' + c.kind + ': ' + c.name, 'info');
                });
            }
        }
    }).catch(function(e) {
        log(id, '❌ Ошибка: ' + e.message, 'err');
    });
}
</script>
</body>
</html>
