<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Выбор адреса</title>
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=939efcd0-c543-4a39-bbda-04cb43eff8df&suggest_apikey=bca2f613-9c3f-4eff-afaa-416e5dd85bc2&load=package.full,SuggestView" type="text/javascript"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f7fc; padding: 12px; }
.card { background: #fff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 480px; width: 100%; margin: 0 auto; padding: 16px 14px 20px; }
#id-indicator { padding: 10px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
#id-indicator.wait { background: #fff8e1; color: #8a6d00; border: 2px dashed #f0a500; }
#id-indicator.ok { background: #e8f5e9; color: #2e7d32; border: 2px solid #43a047; }
#id-indicator.fail { background: #ffebee; color: #c62828; border: 2px solid #e53935; }
#id-indicator.test { background: #e3f2fd; color: #1565c0; border: 2px solid #1976d2; }
#diag { background: #1e2c3a; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
#diag .ok { color: #7ee787; }
#diag .err { color: #ff7b72; }
#diag .info { color: #79c0ff; }
#diag .warn { color: #ffa657; }
#diag .new { color: #d2a8ff; font-weight: bold; }
#address-input { width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 14px; outline: none; box-sizing: border-box; }
#address-input:focus { border-color: #2a5298; }
#address-input.warning { border-color: #f0a500; }
#address-input.error { border-color: #e53935; }
#address-warning { font-size: 13px; line-height: 1.4; padding: 8px 12px; border-radius: 10px; margin-top: 6px; display: none; }
#address-warning.visible { display: block; }
#address-warning.warn { background: #fff8e1; color: #8a6d00; border-left: 4px solid #f0a500; }
#address-warning.error { background: #ffebee; color: #c62828; border-left: 4px solid #e53935; }
#address-warning.ok { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #43a047; }
#map { width: 100%; height: 200px; border-radius: 14px; overflow: hidden; margin: 10px 0; background: #eef2f6; }
.info-row { display: flex; align-items: baseline; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #eef2f6; }
.info-label { font-weight: 500; min-width: 70px; }
.info-value { font-weight: 600; word-break: break-word; flex: 1; font-size: 12px; }
.info-value.empty { color: #8a9aa8; font-weight: 400; font-style: italic; }
.btn-primary { background: #1e3c72; color: #fff; border: none; border-radius: 60px; padding: 13px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(30,60,114,0.25); margin-top: 10px; }
.btn-primary:disabled { background: #c0cbd9; box-shadow: none; cursor: not-allowed; }
.json-block { margin-top: 12px; padding: 12px; background: #f0f4fa; border-radius: 12px; border: 2px dashed #2a5298; }
.json-block-title { font-size: 13px; font-weight: 600; color: #1e3c72; margin-bottom: 8px; }
#json-output { width: 100%; height: 350px; padding: 8px; font-family: 'Courier New', monospace; font-size: 10px; border: 1px solid #d0d9e6; border-radius: 8px; resize: vertical; box-sizing: border-box; color: #1e2c3a; background: #fff; }
.btn-copy { background: #43a047; color: #fff; border: none; border-radius: 30px; padding: 9px 16px; font-size: 13px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 8px; }
.btn-copy:disabled { background: #c0cbd9; cursor: not-allowed; }
.copy-hint { font-size: 11px; color: #555; margin-top: 6px; text-align: center; line-height: 1.4; }
.status { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
.status.ok { color: #2e7d32; font-weight: 600; }
.status.err { color: #c62828; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
<div id="id-indicator" class="wait">⏳ Ждём ID и город от мини-приложения...</div>
<div id="diag">=== СТАРТ v15 (автоподстановка для браузера) ===</div>
<input type="text" id="address-input" placeholder="Введите адрес..." autocomplete="off">
<div id="address-warning"></div>
<div id="map"></div>
<div class="info-row"><span class="info-label">Адрес:</span><span class="info-value empty" id="address-value">не выбран</span></div>
<div class="info-row"><span class="info-label">Ссылка:</span><span class="info-value empty" id="link-value">не выбрана</span></div>

<div class="json-block">
    <div class="json-block-title">📋 JSON (чистый, для PuzzleBot):</div>
    <textarea id="json-output" readonly placeholder="Здесь появится JSON после выбора адреса..."></textarea>
    <button class="btn-copy" id="copy-btn" disabled>📋 Скопировать JSON</button>
    <div class="copy-hint">Выберите адрес → нажмите кнопку → вставьте в форму PuzzleBot</div>
</div>

<button class="btn-primary" id="send-btn" disabled>Сохранить (старый способ)</button>
<div class="status" id="status"></div>
</div>

<script>
var PUZZLEBOT_TOKEN = 'oiteBLvPGR8E83oOxAZrecVWgt4Rop3U';
var PUZZLEBOT_API = 'https://api.puzzlebot.top/';
var GEOCODER_KEY = 'c46e5925-729b-4dfe-be6a-5277d5ab39dc';

// === Значения для теста в браузере ===
var DEFAULT_USER_ID = '0000000000';
var DEFAULT_CITY = 'Краснодар';

var diag = document.getElementById('diag');
function diagLog(text, cls) {
    var time = new Date().toLocaleTimeString('ru-RU');
    diag.innerHTML += '[' + time + '] ' + (cls ? '<span class="' + cls + '">' + text + '</span>' : text) + '\n';
    diag.scrollTop = diag.scrollHeight;
}
diag.innerHTML = '';
diagLog('0. Страница загружена (v15)', 'info');

var tgUserId = '';
var selectedCity = '';
var selectedAddress = '';
var selectedLink = '';
var selectedCoords = null;
var myMap = null;
var myPlacemark = null;
var isTestMode = false;

var idIndicator = document.getElementById('id-indicator');
var jsonOutput = document.getElementById('json-output');
var copyBtn = document.getElementById('copy-btn');
var addressInput = document.getElementById('address-input');
var addressWarning = document.getElementById('address-warning');

// === ПРИЁМ ID и ГОРОДА от родителя ===
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'TG_USER_ID') {
        tgUserId = event.data.userId;
        diagLog('👤 user_id = ' + tgUserId, 'ok');
        updateIndicator();
    }
    if (event.data && event.data.type === 'CITY') {
        selectedCity = event.data.city || '';
        diagLog('🏙️ city = ' + (selectedCity || '(не передан)'), 'ok');
        updateIndicator();
    }
});

function updateIndicator() {
    if (isTestMode) {
        idIndicator.className = 'test';
        idIndicator.innerHTML = '🧪 ТЕСТ В БРАУЗЕРЕ<br>ID: <b>' + tgUserId + '</b><br>🏙️ Город: <b>' + selectedCity + '</b>';
        return;
    }
    if (tgUserId && selectedCity) {
        idIndicator.className = 'ok';
        idIndicator.innerHTML = '✅ ID: <b>' + tgUserId + '</b><br>🏙️ Город: <b>' + selectedCity + '</b>';
    } else if (tgUserId) {
        idIndicator.className = 'ok';
        idIndicator.innerHTML = '✅ ID: <b>' + tgUserId + '</b><br>⏳ Ждём город...';
    }
}

// === Через 3 секунды: если ID/город не пришли — подставляем тестовые ===
setTimeout(function () {
    var needsDefault = false;
    if (!tgUserId) {
        tgUserId = DEFAULT_USER_ID;
        needsDefault = true;
        diagLog('🧪 [ТЕСТ] user_id не получен → подставлен ' + DEFAULT_USER_ID, 'warn');
    }
    if (!selectedCity) {
        selectedCity = DEFAULT_CITY;
        needsDefault = true;
        diagLog('🧪 [ТЕСТ] город не получен → подставлен ' + DEFAULT_CITY, 'warn');
    }
    if (needsDefault) {
        isTestMode = true;
        updateIndicator();
        diagLog('🧪 ТЕСТ-РЕЖИМ АКТИВЕН (данные для продакшена придут из Telegram)', 'warn');
    }
}, 3000);

function saveVariableImage(variableName, value) {
    var url = PUZZLEBOT_API +
        '?token=' + encodeURIComponent(PUZZLEBOT_TOKEN) +
        '&method=variableChange' +
        '&variable=' + encodeURIComponent(variableName) +
        '&expression=' + encodeURIComponent(value) +
        '&user_id=' + encodeURIComponent(tgUserId);
    diagLog('💾 [IMAGE] ' + variableName, 'info');
    var img = new Image();
    img.onload = function() { diagLog('   ✅ onload', 'ok'); };
    img.onerror = function() { diagLog('   ⚠️ onerror — норм', 'warn'); };
    img.src = url;
}

function safeCall(obj, method) {
    try {
        if (typeof obj[method] === 'function') {
            var res = obj[method]();
            if (Array.isArray(res)) return res;
            return res ? [res] : [];
        }
    } catch (e) { return []; }
    return [];
}

function showWarning(text, type) {
    if (!text) {
        addressWarning.className = '';
        addressWarning.textContent = '';
        addressWarning.style.display = 'none';
        addressInput.className = '';
        return;
    }
    addressWarning.className = 'visible ' + type;
    addressWarning.textContent = text;
    addressInput.className = type === 'error' ? 'error' : (type === 'warn' ? 'warning' : '');
}

// === Проверка «в городе» по locality → area (частичное совпадение) ===
function checkInCity(localityArr, areaArr, cityName) {
    if (!cityName) return true;
    var cityLower = cityName.toLowerCase();

    for (var i = 0; i < localityArr.length; i++) {
        if (localityArr[i].toLowerCase().indexOf(cityLower) !== -1) {
            diagLog('   ✅ locality совпал: ' + localityArr[i], 'ok');
            return true;
        }
    }

    for (var j = 0; j < areaArr.length; j++) {
        if (areaArr[j].toLowerCase().indexOf(cityLower) !== -1) {
            diagLog('   ✅ area совпал: ' + areaArr[j], 'ok');
            return true;
        }
    }

    diagLog('   ❌ ни locality, ни area не совпали с «' + cityName + '»', 'warn');
    return false;
}

// === Разбор ориентиров по префиксам ===
var ORIENT_PREFIXES = [
    { field: 'microdistrict', prefixes: ['микрорайон', 'мкр', 'мкрн', 'мкр-н'] },
    { field: 'zhk', prefixes: ['жк', 'жилой комплекс', 'ж/к'] },
    { field: 'kvartal', prefixes: ['квартал', 'кв-л', 'кв.'] },
    { field: 'massiv', prefixes: ['массив', 'жилмассив', 'жилой массив'] },
    { field: 'cottage', prefixes: ['кп', 'коттеджный посёлок', 'коттеджный поселок'] },
    { field: 'snt', prefixes: ['снт', 'садоводческое товарищество'] },
    { field: 'dnt', prefixes: ['днт', 'дачное некоммерческое товарищество'] },
    { field: 'tszh', prefixes: ['тсж', 'тсн', 'товарищество собственников'] },
    { field: 'promzona', prefixes: ['промзона', 'промышленная зона'] },
    { field: 'zhilrayon', prefixes: ['жилой район', 'ж/р'] },
    { field: 'grad', prefixes: ['град'] },
    { field: 'gorodok', prefixes: ['городок'] },
    { field: 'mahalla', prefixes: ['махалля', 'махаллинский'] },
    { field: 'poselok', prefixes: ['посёлок', 'поселок', 'п.'] },
    { field: 'stanitsa', prefixes: ['станица', 'ст-ца'] },
    { field: 'hutor', prefixes: ['хутор', 'х.'] },
    { field: 'aul', prefixes: ['аул'] },
    { field: 'derevnya', prefixes: ['деревня', 'д.'] },
    { field: 'selo', prefixes: ['село', 'с.'] },
    { field: 'kishlak', prefixes: ['кишлак', 'к.'] },
    { field: 'sloboda', prefixes: ['слобода', 'сл.'] },
    { field: 'mestechko', prefixes: ['местечко', 'м.'] }
];

function detectOrientField(text) {
    var lower = text.toLowerCase().trim();
    for (var i = 0; i < ORIENT_PREFIXES.length; i++) {
        var item = ORIENT_PREFIXES[i];
        for (var j = 0; j < item.prefixes.length; j++) {
            var pref = item.prefixes[j].toLowerCase();
            if (lower.indexOf(pref) === 0) {
                return item.field;
            }
        }
    }
    return 'other_orient';
}

function fetchAllComponents(coords, baseJson, onDone) {
    var lat = coords[0];
    var lon = coords[1];

    var geocoderUrl = 'https://geocode-maps.yandex.ru/1.x/?apikey=' + GEOCODER_KEY +
        '&format=json&results=1&lang=ru_RU&geocode=' + lon + ',' + lat;

    diagLog('🔄 [API ГЕОКОДЕРА] Запрос компонентов...', 'new');

    fetch(geocoderUrl)
        .then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
        })
        .then(function(data) {
            diagLog('✅ [API ГЕОКОДЕРА] Прямой запрос сработал', 'ok');
            processGeocoderData(data, baseJson, onDone);
        })
        .catch(function(err) {
            diagLog('❌ [API ГЕОКОДЕРА] Ошибка: ' + err.message, 'err');
            onDone(baseJson);
        });
}

function processGeocoderData(data, baseJson, onDone) {
    try {
        var members = data.response.GeoObjectCollection.featureMember;
        if (!members || members.length === 0) {
            diagLog('⚠️ Компоненты не найдены', 'warn');
            onDone(baseJson);
            return;
        }

        var geoObj = members[0].GeoObject;
        var meta = geoObj.metaDataProperty.GeocoderMetaData;
        var components = meta.Address && meta.Address.Components ? meta.Address.Components : [];

        diagLog('📍 Адрес: ' + (meta.text || '(пусто)'), 'ok');
        diagLog('🔍 Компонентов: ' + components.length, 'info');

        var allByKind = {};
        components.forEach(function(c) {
            diagLog('   ' + c.kind + ': ' + c.name, 'info');
            if (!allByKind[c.kind]) allByKind[c.kind] = [];
            allByKind[c.kind].push(c.name);
        });

        var officialLocality = allByKind.locality || [];
        var officialArea = allByKind.area || [];
        var officialDistrict = allByKind.district || [];
        var officialStreet = allByKind.street || [];
        var officialHouse = allByKind.house || [];

        diagLog('🏙️ Проверка in_city для «' + selectedCity + '»:', 'new');
        var inCity = checkInCity(officialLocality, officialArea, selectedCity);
        diagLog('   in_city = ' + inCity, inCity ? 'ok' : 'warn');

        var orientSource = [];
        officialLocality.forEach(function(v) { orientSource.push(v); });
        officialDistrict.forEach(function(v) { orientSource.push(v); });

        var orient = {
            microdistrict: [], zhk: [], kvartal: [], massiv: [], cottage: [],
            snt: [], dnt: [], tszh: [], promzona: [], zhilrayon: [],
            grad: [], gorodok: [], mahalla: [],
            poselok: [], stanitsa: [], hutor: [], aul: [], derevnya: [],
            selo: [], kishlak: [], sloboda: [], mestechko: [],
            other_orient: []
        };

        if (inCity) {
            orientSource.forEach(function(v) {
                var field = detectOrientField(v);
                orient[field].push(v);
                diagLog('   orient: «' + v + '» → ' + field, 'info');
            });
        } else {
            diagLog('   ⚠️ Адрес вне города, ориентиры кладём как есть', 'warn');
            officialLocality.forEach(function(v) {
                var field = detectOrientField(v);
                orient[field].push(v);
                diagLog('   orient: «' + v + '» → ' + field, 'info');
            });
        }

        var cleanJson = {
            coords: baseJson.coords,
            in_city: inCity,
            area: officialArea,
            locality: officialLocality,
            microdistrict: orient.microdistrict,
            zhk: orient.zhk,
            kvartal: orient.kvartal,
            massiv: orient.massiv,
            cottage: orient.cottage,
            snt: orient.snt,
            dnt: orient.dnt,
            tszh: orient.tszh,
            promzona: orient.promzona,
            zhilrayon: orient.zhilrayon,
            grad: orient.grad,
            gorodok: orient.gorodok,
            mahalla: orient.mahalla,
            poselok: orient.poselok,
            stanitsa: orient.stanitsa,
            hutor: orient.hutor,
            aul: orient.aul,
            derevnya: orient.derevnya,
            selo: orient.selo,
            kishlak: orient.kishlak,
            sloboda: orient.sloboda,
            mestechko: orient.mestechko,
            district: officialDistrict,
            other_orient: orient.other_orient,
            street: officialStreet,
            house: officialHouse,
            precision: meta.precision || '',
            link: baseJson.link,
            metro: allByKind.metroStation || [],
            railway: allByKind.railwayStation || [],
            station: allByKind.station || [],
            vegetation: allByKind.vegetation || [],
            hydro: allByKind.hydro || [],
            airport: allByKind.airport || [],
            other: allByKind.other || []
        };

        var precision = cleanJson.precision;
        var houseArr = cleanJson.house;

        if (!inCity) {
            showWarning('⚠️ Этот адрес находится вне выбранного города (' + (cleanJson.area[0] || 'другой район') + '). Проверьте, пожалуйста.', 'warn');
            diagLog('⚠️ Адрес вне города', 'warn');
        } else if (precision === 'exact' && houseArr.length > 0) {
            showWarning('✅ Адрес определён точно: ' + houseArr[0], 'ok');
        } else if (precision === 'other' || houseArr.length === 0) {
            showWarning('⚠️ Дом не определён точно. Проверьте номер дома — возможно, опечатка.', 'warn');
        } else if (precision === 'number') {
            showWarning('⚠️ Номер дома найден, но корпус не уточнён. Проверьте.', 'warn');
        } else {
            showWarning('', '');
        }

        onDone(cleanJson);
    } catch (e) {
        diagLog('❌ Ошибка обработки: ' + e.message, 'err');
        onDone(baseJson);
    }
}

copyBtn.addEventListener('click', function() {
    if (!jsonOutput.value) return;
    jsonOutput.select();
    jsonOutput.setSelectionRange(0, 999999);
    try {
        document.execCommand('copy');
        diagLog('📋 JSON скопирован', 'ok');
        copyBtn.textContent = '✅ Скопировано!';
        setTimeout(function() { copyBtn.textContent = '📋 Скопировать JSON'; }, 2000);
    } catch (e) {
        diagLog('❌ Не удалось скопировать: ' + e.message, 'err');
    }
});

ymaps.ready(function () {
    diagLog('1. ymaps готов ✅', 'ok');

    var addressValue = document.getElementById('address-value');
    var linkValue = document.getElementById('link-value');
    var sendBtn = document.getElementById('send-btn');
    var statusEl = document.getElementById('status');

    myMap = new ymaps.Map('map', {
        center: [45.035470, 38.975313],
        zoom: 12,
        controls: ['zoomControl']
    });

    myPlacemark = new ymaps.Placemark(myMap.getCenter(), {}, { preset: 'islands#blueIcon' });
    myMap.geoObjects.add(myPlacemark);

    var suggestView = new ymaps.SuggestView('address-input', { results: 10 });
    diagLog('2. SuggestView создан ✅', 'ok');

    suggestView.events.add('select', function (e) {
        var item = e.get('item');
        var value = item.value;
        var displayName = item.displayName || value;

        selectedAddress = displayName || value;
        selectedLink = 'https://yandex.ru/maps/?text=' + encodeURIComponent(value);

        addressValue.textContent = selectedAddress;
        addressValue.classList.remove('empty');
        linkValue.textContent = selectedLink;
        linkValue.classList.remove('empty');
        sendBtn.disabled = false;
        statusEl.textContent = '';

        showWarning('⏳ Проверяем адрес...', 'warn');

        diagLog('✅ Выбран адрес: ' + selectedAddress, 'ok');
        jsonOutput.value = 'Загрузка данных...';

        ymaps.geocode(value, { results: 1 }).then(function (res) {
            var firstGeoObject = res.geoObjects.get(0);
            if (!firstGeoObject) {
                diagLog('❌ Геокодер не вернул результат', 'err');
                jsonOutput.value = 'Геокодер не вернул результат';
                showWarning('❌ Адрес не распознан', 'error');
                return;
            }

            var coords = firstGeoObject.geometry.getCoordinates();
            selectedCoords = coords;
            myMap.setCenter(coords, 16);
            myPlacemark.geometry.setCoordinates(coords);
            diagLog('   Координаты: ' + coords, 'info');

            var baseJson = {
                coords: coords,
                link: selectedLink
            };

            fetchAllComponents(coords, baseJson, function(finalJson) {
                var pretty = JSON.stringify(finalJson, null, 2);
                jsonOutput.value = pretty;
                copyBtn.disabled = false;
                diagLog('✅ Итоговый JSON (' + pretty.length + ' символов)', 'ok');
            });

        }).catch(function(err) {
            diagLog('❌ Ошибка ymaps.geocode: ' + err.message, 'err');
            jsonOutput.value = 'Ошибка: ' + err.message;
            showWarning('❌ Ошибка: ' + err.message, 'error');
        });
    });

    addressInput.addEventListener('input', function() {
        if (addressInput.value.length < 3) {
            showWarning('', '');
        }
    });

    sendBtn.addEventListener('click', function () {
        diagLog('🖱️ Нажата Сохранить', 'info');
        statusEl.className = 'status';
        statusEl.textContent = '';
        if (!selectedAddress || !selectedLink) return;
        if (!tgUserId) {
            statusEl.className = 'status err';
            statusEl.textContent = 'ID не получен';
            return;
        }
        saveVariableImage('ADD_APP_ADDRESS', selectedAddress);
        saveVariableImage('ADD_APP_LINK', selectedLink);
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Отправлено';
    });

    diagLog('3. Готово. Выберите адрес.', 'warn');
});
