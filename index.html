<iframe id="address-iframe" src="https://jindogggg.github.io/map-app/" width="100%" height="600" frameborder="0" style="border-radius: 16px;"></iframe>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    (function() {
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) { try { tg.ready(); } catch(e) {} }
        var userId = '';
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            userId = String(tg.initDataUnsafe.user.id);
        }
        var city = '{{ADD_APP_CITY}}'; // ← подставляется PuzzleBot'ом

        var iframe = document.getElementById('address-iframe');
        iframe.addEventListener('load', function() {
            if (userId) {
                iframe.contentWindow.postMessage({ type: 'TG_USER_ID', userId: userId }, '*');
            }
            if (city) {
                iframe.contentWindow.postMessage({ type: 'CITY', city: city }, '*');
            }
        });
    })();
</script>
