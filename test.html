<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест передачи в PuzzleBot</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f7fc; }
.card { background: #fff; border-radius: 16px; padding: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
h2 { font-size: 18px; margin-bottom: 12px; color: #1e3c72; }
p { font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
button { background: #1e3c72; color: #fff; border: none; border-radius: 30px; padding: 14px 20px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
button:disabled { background: #c0cbd9; }
#log { background: #1e2c3a; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 11px; padding: 12px; border-radius: 8px; margin-top: 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; max-height: 300px; overflow-y: auto; }
.ok { color: #7ee787; }
.err { color: #ff7b72; }
.info { color: #79c0ff; }
input { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
<h2>🧪 Тест передачи в PuzzleBot</h2>
<p>Введи свой Telegram ID и нажми кнопку. Скрипт отправит слово <b>test</b> в переменную <b>ADD_APP_TEST</b> через прокси allorigins.win.</p>
<input type="text" id="user-id" placeholder="Telegram ID (например, 1509864197)" value="1509864197">
<button id="send-btn">Отправить тест</button>
<div id="log">Готов к отправке...</div>
</div>

<script>
var PUZZLEBOT_TOKEN = 'oiteBLvPGR8E83oOxAZrecVWgt4Rop3U';
var PUZZLEBOT_API = 'https://api.puzzlebot.top/';
var CORS_PROXY = 'https://api.allorigins.win/raw?url=';

var logEl = document.getElementById('log');
function log(text, cls) {
    var span = cls ? '<span class="' + cls + '">' + text + '</span>' : text;
    logEl.innerHTML += '\n' + span;
    logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('send-btn').addEventListener('click', function() {
    var userId = document.getElementById('user-id').value.trim();
    if (!userId) { alert('Введи Telegram ID'); return; }

    logEl.innerHTML = '=== НАЧАЛО ТЕСТА ===';

    // Собираем URL для PuzzleBot
    var targetUrl = PUZZLEBOT_API +
        '?token=' + encodeURIComponent(PUZZLEBOT_TOKEN) +
        '&method=variableChange' +
        '&variable=ADD_APP_TEST' +
        '&expression=test' +
        '&user_id=' + encodeURIComponent(userId);

    log('Целевой URL PuzzleBot:', 'info');
    log(targetUrl);
    log('');

    // Оборачиваем в прокси
    var proxyUrl = CORS_PROXY + encodeURIComponent(targetUrl);
    log('URL через прокси:', 'info');
    log(proxyUrl);
    log('');

    // Отправляем запрос
    log('Отправка запроса...', 'info');

    fetch(proxyUrl, { method: 'GET' })
        .then(function(response) {
            log('✅ Ответ получен! Статус: ' + response.status, 'ok');
            return response.text();
        })
        .then(function(text) {
            log('Ответ от PuzzleBot:', 'ok');
            log(text);
            log('');
            log('=== ТЕСТ ЗАВЕРШЁН ===', 'ok');
            log('Проверь переменную ADD_APP_TEST в PuzzleBot.', 'info');
        })
        .catch(function(error) {
            log('❌ ОШИБКА: ' + error.message, 'err');
            log('');
            log('Если ошибка — прокси не сработал.', 'err');
        });
});
</script>
</body>
</html>
